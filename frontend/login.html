<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhorerBazar MIS — লগইন</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      gbIdentity: '#378ADD', gbTrust: '#639922', gbRisk: '#E24B4A',
      gbVIP: '#EF9F27',
    }}}
  }
</script>
<style>
  body{font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",Segoe UI,sans-serif}
  :focus-visible{ outline: 2px solid #378ADD !important; outline-offset: 2px !important; border-radius: 6px; }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center gap-2 mb-6">
      <div class="bg-amber-500 text-white w-14 h-14 rounded-2xl font-bold text-2xl tracking-wider flex items-center justify-center shadow-sm">GB</div>
      <div class="text-center">
        <p class="font-bold text-lg text-slate-800">GhorerBazar</p>
        <p class="text-sm font-semibold text-slate-500">Management Information System</p>
      </div>
    </div>

    <form id="login-form" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-4" novalidate>
      <div>
        <label for="employee-id" class="block text-sm font-bold text-slate-700 mb-1">Employee ID</label>
        <input id="employee-id" name="employee_id" type="text" autocomplete="username" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gbIdentity/50"
          placeholder="যেমন: 10163">
      </div>
      <div>
        <label for="password" class="block text-sm font-bold text-slate-700 mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gbIdentity/50"
          placeholder="••••••••">
      </div>

      <div id="login-error" class="hidden text-sm text-gbRisk bg-gbRisk/10 border border-gbRisk/30 rounded-lg px-3 py-2 font-medium"></div>

      <button type="submit" id="login-submit-btn"
        class="w-full bg-gbIdentity text-white font-bold text-sm py-2.5 rounded-lg shadow-sm hover:brightness-95 transition disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span id="login-submit-label">লগইন করুন</span>
      </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-4">GhorerBazar MIS &middot; Internal use only</p>
  </div>

<script>
  const API_BASE = 'https://customer-profile-management.onrender.com/api';
  // Same file this login redirects to on success — kept as one constant so
  // there's a single place to change if the dashboard file is ever renamed.
  const DASHBOARD_URL = 'GhorerBazar_Customer360_Dashboard_v2.html';

  const form = document.getElementById('login-form');
  const errBox = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit-btn');
  const submitLabel = document.getElementById('login-submit-label');

  function setLoading(isLoading){
    submitBtn.disabled = isLoading;
    submitLabel.textContent = isLoading ? 'লগইন হচ্ছে...' : 'লগইন করুন';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.add('hidden');
    const employeeId = document.getElementById('employee-id').value.trim();
    const password = document.getElementById('password').value;
    if (!employeeId || !password) {
      errBox.textContent = 'Employee ID এবং Password দুটোই দিতে হবে।';
      errBox.classList.remove('hidden');
      return;
    }

    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employee_id: employeeId, password }),
      });

      if (res.status === 401) {
        errBox.textContent = 'Employee ID অথবা Password সঠিক নয়।';
        errBox.classList.remove('hidden');
        return;
      }
      if (res.status === 403) {
        errBox.textContent = 'এই অ্যাকাউন্টটি নিষ্ক্রিয় করা হয়েছে — আপনার সুপারভাইজারের সাথে যোগাযোগ করুন।';
        errBox.classList.remove('hidden');
        return;
      }
      if (!res.ok) {
        errBox.textContent = `সার্ভার একটা এরর দিয়েছে (status ${res.status})।`;
        errBox.classList.remove('hidden');
        return;
      }

      const data = await res.json();
      // Token travels via a URL query param (not localStorage/sessionStorage,
      // per spec) into the dashboard's in-memory AUTH_TOKEN variable — see
      // that file's init block.
      window.location.href = `${DASHBOARD_URL}?token=${encodeURIComponent(data.token)}`;
    } catch (err) {
      console.error('POST /api/auth/login — network/connection failure:', err);
      errBox.textContent = 'সার্ভারের সাথে সংযোগ করা যায়নি। ব্যাকএন্ড (uvicorn) চালু আছে কিনা দেখুন।';
      errBox.classList.remove('hidden');
    } finally {
      setLoading(false);
    }
  });
</script>
</body>
</html>
