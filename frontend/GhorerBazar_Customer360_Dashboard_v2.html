function bnEn(text){
  const t = text || '';
  return { bn: t, en: t };
}

// Known enum values the backend returns as plain codes (segment/badge
// labels) — mapped to bn/en display text client-side, matching the
// approach documented in schemas.py.
const ENUM_LABELS = {
  'VIP Customer': { bn: 'ভিআইপি কাস্টমার', en: 'VIP Customer' },
  'Loyal':        { bn: 'অনুগত গ্রাহক',     en: 'Loyal' },
  'New':          { bn: 'নতুন গ্রাহক',      en: 'New' },
  'Dormant':      { bn: 'সুপ্ত গ্রাহক',     en: 'Dormant' },
  'At-Risk':      { bn: 'ঝুঁকিপূর্ণ',        en: 'At-Risk' },
};
function enumLabel(text){ return ENUM_LABELS[text] || bnEn(text); }

// The backend returns raw agent_assignment_history.new_status values
// (e.g. "Order Placed", "Unreachable"), not the prototype's
// positive/follow/negative dot codes — this is a UI-only classification,
// not stored anywhere.
const NEGATIVE_CALL_STATUSES = ['Unreachable', 'Switch Off', 'Not Interested', 'Aborted'];
const POSITIVE_CALL_STATUSES = ['Order Placed', 'Recently Ordered', 'Interested'];
function mapCallStatus(newStatus){
  if (NEGATIVE_CALL_STATUSES.includes(newStatus)) return 'negative';
  if (POSITIVE_CALL_STATUSES.includes(newStatus)) return 'positive';
  return 'follow';
}

// dcm.agent_assignment_history.previous_status/new_status are free text
// typed/picked by agents (no DB enum) — this covers the values seen in
// practice and falls back to the raw string for anything not listed, so
// an unmapped status still shows something sensible instead of "Unknown".
const STATUS_LABELS_BN = {
  'Interested': 'আগ্রহী',
  'Not Interested': 'অনাগ্রহী',
  'Unreachable': 'অসাড় (রিচ করা যায়নি)',
  'Switch Off': 'ফোন বন্ধ',
  'Order Placed': 'অর্ডার প্লেসড',
  'Recently Ordered': 'সম্প্রতি অর্ডার করেছেন',
  'Callback Request': 'কলব্যাক অনুরোধ',
  'In Transit': 'ইন ট্রানজিট',
  'Follow Up': 'ফলো আপ',
  'Follow-up': 'ফলো আপ',
  'Delivered': 'ডেলিভার্ড',
  'Cancelled': 'বাতিল',
  'Returned': 'রিটার্ন',
  'Aborted': 'অ্যাবোর্টেড',
  'Inform Later': 'পরে জানানো হবে',
};
function translateStatus(status, L){
  if (!status) return '';
  return L === 'bn' ? (STATUS_LABELS_BN[status] || status) : status;
}

const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBnDigits(n){ return String(n).replace(/[0-9]/g, d => BN_DIGITS[+d]); }
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Formats the raw ISO created_at from agent_assignment_history into a
// human-readable date (no time) for the Call History sentence — e.g.
// "৩১ জুলাই, ২০২৬" (bn) / "Jul 31, 2026" (en).
function formatCallDate(isoStr, L){
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  const day = d.getDate(), month = d.getMonth(), year = d.getFullYear();
  return L === 'bn'
    ? `${toBnDigits(day)} ${BN_MONTHS[month]}, ${toBnDigits(year)}`
    : `${EN_MONTHS[month]} ${day}, ${year}`;
}

// delivery is a per-courier breakdown (spec query 5.5); the prototype's
// UI wants a single top courier + rate, so pick the highest-volume one.
function pickTopDelivery(deliveryList){
  if (!deliveryList || !deliveryList.length) return { courier: bnEn(''), successRate: 0 };
  const top = deliveryList.slice().sort((a, b) => (b.total || 0) - (a.total || 0))[0];
  // success_rate_pct comes back from SQL as a long unrounded float (e.g.
  // 57.894736842105) — round once here rather than at every display site.
  return { courier: bnEn(top.courier), successRate: Math.round(top.success_rate_pct || 0) };
}

/* Maps GET /api/customer/{phone}'s JSON onto the shape renderCustomer()/
   renderOrders()/renderProducts()/renderCalls()/renderDelivery()/
   renderChannel() already expect. DB-sourced single-language fields
   (name, address, product/courier/reason/note text) are wrapped as
   {bn:x, en:x} since the backend can't manufacture a translation — see
   schemas.py's documented bn/en decision. Fields the backend doesn't
   source yet (tenure, preferredContactTime, topCategory, avgDeliveryDays,
   channel/payment breakdown) fall back to empty/zero rather than crashing. */
function mapApiResponseToCustomer(api){
  const m = api.metrics || {};
  const cs = api.call_stats || {};
  const ai = api.ai_summary || {};
  const topDelivery = pickTopDelivery(api.delivery);
  return {
    phone: api.phone,
    name: api.name || (currentLang === 'bn' ? '(নাম পাওয়া যায়নি)' : '(name unavailable)'),
    tier: api.tier || 'red',
    addresses: (api.addresses && api.addresses.length)
      ? api.addresses.map(a => ({ ...bnEn(a.text), primary: a.primary }))
      : [{ ...bnEn(currentLang === 'bn' ? 'ঠিকানা পাওয়া যায়নি' : 'No address on file'), primary: true }],
    segment: enumLabel(api.segment || ''),
    tenure: bnEn(''),
    preferredContactTime: bnEn(''),
    topCategory: bnEn(''),
    topCategoryPct: 0,
    avgDeliveryDays: 0,
    reliabilityScore: api.reliability_score != null ? api.reliability_score : 0,
    consent: ai.consent_signal === 'do_not_call' ? 'donotcall' : (ai.consent_signal || null),
    interestedIn: { bn: ai.interested_in_bn || [], en: ai.interested_in_en || [] },
    badges: (api.badges || []).map(b => ({ icon: b.icon, color: b.color, label: enumLabel(b.label), filter: b.filter })),
    due: api.due_amount || 0,
    // generated_at is only set once the background job has actually run
    // for this customer — null means "not generated yet" (a real, expected
    // state for most customers right now), not an error.
    hasAiSummary: !!ai.generated_at,
    aiSummaryShort: bnEn(ai.short_bn || ai.short_en || ''),
    notesCount: ai.notes_count || 0,
    aiSummaryFull: { bn: ai.full_bn || [], en: ai.full_en || [] },
    metrics: {
      totalOrders: m.total_orders || 0,
      ltv: m.ltv || 0,
      aov: m.aov || 0,
      cancelRate: m.cancel_rate_pct || 0,
      returnRate: m.return_rate_pct || 0,
      recencyDays: m.recency_days != null ? m.recency_days : 0,
      lastOrderDate: bnEn(m.last_order_date || (currentLang === 'bn' ? 'তথ্য নেই' : 'N/A')),
    },
    callStats: {
      totalAttempts: cs.total_attempts || 0,
      reachRate: cs.reach_rate_pct || 0,
      conversionRate: cs.conversion_rate_pct || 0,
      unreachableStreak: cs.unreachable_streak || 0,
    },
    callPatternSummary: bnEn(ai.call_pattern_bn || ai.call_pattern_en || ''),
    orders: (api.orders || []).map(o => ({
      invoice: o.invoice,
      status: o.status,
      date: bnEn(o.date || ''),
      deliveryFee: o.delivery_fee || 0,
      paid: o.paid_amount || 0,
      due: o.due_amount || 0,
      courier: bnEn(o.courier || ''),
      deliveryId: o.delivery_id || '',
      method: bnEn(o.payment_method || ''),
      reason: o.cancelled_flagged_reason ? bnEn(o.cancelled_flagged_reason) : null,
      // Not part of the API response yet (TestMaster has no discount
      // column) — kept here so the UI already supports it, falsy/0 for
      // every real order today and simply hidden by renderOrders().
      discount: o.discount || 0,
      // The courier's OWN tracking status — separate from `status` above,
      // and can genuinely disagree with it (confirmed live: a real order
      // with status='intransit' but deliveryPartnerStatus='delivered').
      deliveryPartnerStatus: o.delivery_partner_status || '',
      pickupLocation: o.pickup_location || '',
      timeline: {
        orderDate: (o.timeline && o.timeline.order_date) || '',
        shippingDate: (o.timeline && o.timeline.shipping_date) || '',
        shippedAt: (o.timeline && o.timeline.shipped_at) || '',
        deliveredAt: (o.timeline && o.timeline.delivered_at) || '',
      },
      items: (o.items || []).map(it => ({
        img: it.image || '',
        name: bnEn(it.product_name || ''),
        sku: it.product_sku || '',
        qty: it.qty,
        unitPrice: it.unit_price,
        damagedQty: it.damaged_qty || 0,
      })),
    })),
    products: (api.products || []).map((p, i) => ({
      img: '',
      name: bnEn(p.product_name || ''),
      count: p.bought_count || 0,     // order count ("বার কেনা হয়েছে") — COUNT(DISTINCT Invoice)
      qty: p.bought_qty || 0,          // total pieces purchased — SUM(ProductQty)
      returned: p.returned_qty || 0,
      returnRatePct: p.return_rate_pct || 0,
      top: i === 0,
    })),
    calls: (api.calls || []).map(c => ({
      dateRaw: c.date || '',
      status: mapCallStatus(c.status),
      newStatusRaw: c.status || '',
      note: c.note || '',
      agentName: c.agent_name || '',
    })),
    // Full status-change history breakdown (not just the last 5 calls
    // shown in the list) — backend already computes count+pct across
    // every call, sorted by count DESC.
    callStatusBreakdown: (api.call_status_breakdown || []).map(x => ({
      status: x.status, count: x.count, pct: x.pct,
    })),
    delivery: { courier: topDelivery.courier, successRate: topDelivery.successRate },
    // Full per-courier breakdown (not just the top one) — for the new
    // courier performance bar chart on the Delivery page.
    deliveryCouriers: (api.delivery || []).map(d => ({
      courier: bnEn(d.courier || ''), total: d.total || 0, successRate: d.success_rate_pct || 0,
    })),
    deliverySummary: {
      totalQty: (api.delivery_summary && api.delivery_summary.total_qty) || 0,
      damagedQty: (api.delivery_summary && api.delivery_summary.damaged_qty) || 0,
      damageRatePct: (api.delivery_summary && api.delivery_summary.damage_rate_pct) || 0,
    },
    pickupBreakdown: (api.pickup_breakdown || []).map(x => ({ label: bnEn(x.label), pct: x.pct })),
    channelBreakdown: (api.channel_breakdown || []).map(x => ({ label: bnEn(x.label), pct: x.pct })),
    paymentBreakdown: (api.payment_breakdown || []).map(x => ({ label: bnEn(x.label), pct: x.pct })),
  };
}

async function loadCustomerFromAPI(phone){
  const errBox = document.getElementById('search-error');
  errBox.classList.add('hidden');
  showLoading(true);
  try {
    const res = await fetch(`${API_BASE}/customer/${phone}`, { headers: authHeaders() });

    if (res.status === 404) {
      errBox.textContent = LABELS[currentLang].searchNotFound;
      errBox.classList.remove('hidden');
      return;
    }
    if (res.status === 401 || res.status === 403) {
      errBox.textContent = currentLang === 'bn'
        ? 'সেশন যাচাই ব্যর্থ হয়েছে — AUTH_TOKEN ঠিক আছে কিনা দেখুন।'
        : 'Session check failed — verify AUTH_TOKEN is set correctly.';
      errBox.classList.remove('hidden');
      return;
    }
    if (!res.ok) {
      // Server WAS reached (this is different from the catch block below,
      // which only fires when fetch() itself can't even get a response).
      // Surface the body if the backend sent error detail (FastAPI does,
      // as {"detail": "..."}), so a 500 says why, not just "can't connect".
      let detail = '';
      try {
        const body = await res.json();
        if (body && body.detail) detail = `: ${body.detail}`;
      } catch (_) { /* body wasn't JSON — ignore */ }
      errBox.textContent = currentLang === 'bn'
        ? `সার্ভার একটা এরর দিয়েছে (status ${res.status})${detail}`
        : `Server returned an error (status ${res.status})${detail}`;
      errBox.classList.remove('hidden');
      return;
    }

    const data = await res.json();
    CUSTOMERS[phone] = mapApiResponseToCustomer(data);
    loadCustomer(phone);
    refreshRecentFromAPI();
  } catch (err) {
    // This catch only fires when fetch() itself rejects — a genuine
    // network-level failure (wrong URL, server down, or the browser
    // blocking the request outright, e.g. from file://). Any real HTTP
    // response, including 500, is handled above and never reaches here.
    console.error('GET /api/customer/{phone} — network/connection failure:', err);
    errBox.textContent = currentLang === 'bn'
      ? 'সার্ভারের সাথে সংযোগ করা যায়নি (customer profile লোড করার সময়)। ব্যাকএন্ড (uvicorn) চালু আছে কিনা দেখুন। এই পেজটা file:// দিয়ে সরাসরি খোলা থাকলে, তার বদলে "python -m http.server" দিয়ে সার্ভ করে দেখুন — অনেক ব্রাউজার file:// পেজ থেকে fetch() ব্লক করে দেয়।'
      : 'Could not reach the server (while loading customer profile). Check that the backend (uvicorn) is running. If this page is open via file://, try serving it with "python -m http.server" instead — many browsers block fetch() from file:// pages outright.';
    errBox.classList.remove('hidden');
  } finally {
    showLoading(false);
  }
}

/* ============ Search ============ */
function normalizePhone(raw){
  let digits = raw.replace(/\D/g, '');
  if (digits.startsWith('880')) digits = digits;
  else if (digits.startsWith('0')) digits = '880' + digits.slice(1);
  else if (digits.length === 10) digits = '880' + digits;
  return digits;
}

function doSearch(){
  const raw = document.getElementById('search-input').value.trim();
  if (!raw) return;
  const key = normalizePhone(raw);
  document.getElementById('search-input').value = '';
  loadCustomerFromAPI(key);
}

function loadCustomer(key){
  currentCustomerKey = key;
  activeOrderFilter = null;
  ordersShowAll = false;
  productsShowAll = false;
  renderCustomer();
  switchTab('orders');
}

let recentSearchList = [];

async function refreshRecentFromAPI(){
  try {
    const res = await fetch(`${API_BASE}/search/recent`, { headers: authHeaders() });
    if (!res.ok) {
      // Distinct from loadCustomerFromAPI's error — this is the
      // "recent searches" section specifically, not the main profile
      // fetch, and it's non-fatal (search still works without it).
      console.error('GET /api/search/recent returned', res.status);
      showRecentError(res.status);
      return;
    }
    recentSearchList = await res.json();
    renderRecent();
  } catch (err) {
    console.error('GET /api/search/recent — network/connection failure:', err);
    showRecentError(null);
  }
}

function showRecentError(status){
  const box = document.getElementById('recent-chips');
  const detail = status ? ` (status ${status})` : '';
  const msg = currentLang === 'bn'
    ? `সাম্প্রতিক সার্চ লোড করা যায়নি${detail}`
    : `Could not load recent searches${detail}`;
  box.innerHTML = `<span class="text-micro text-gbRisk">${msg}</span>`;
}

function renderRecent(){
  const box = document.getElementById('recent-chips');
  box.innerHTML = recentSearchList.map(item => {
    const label = item.name || item.phone;
    return `<button onclick="loadCustomerFromAPI('${item.phone}')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-medium transition">${label}</button>`;
  }).join('');
}

/* ============ AI summary toggle ============ */
function toggleAISummary(){
  if (!currentCustomerKey) return;
  const full = document.getElementById('ai-summary-full');
  const chevron = document.getElementById('ai-summary-chevron');
  const label = document.getElementById('ai-summary-toggle-label');
  const c = CUSTOMERS[currentCustomerKey];
  const showing = full.classList.contains('hidden');
  full.classList.toggle('hidden');
  chevron.classList.toggle('chevron-rot');
  label.textContent = showing
    ? LABELS[currentLang].aiDetailsHide
    : (currentLang==='bn' ? `${LABELS.bn.aiDetailsShow} (${c.notesCount}টি নোট থেকে প্রাপ্ত)` : `${LABELS.en.aiDetailsShow} (from ${c.notesCount} notes)`);
}

/* ============ Action panel ============ */
function toggleActionPanel(){
  const drawer = document.getElementById('action-drawer');
  drawer.classList.toggle('translate-x-full');
  const isOpen = !drawer.classList.contains('translate-x-full');
  if (isOpen) document.getElementById('drawer-backdrop').classList.remove('hidden');
  else checkBackdrop();
}
let selectedStatus = null;
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('ring-2','ring-gbIdentity'));
      btn.classList.add('ring-2','ring-gbIdentity');
      selectedStatus = btn.textContent;
    });
  });
});
function saveAction(){
  toggleActionPanel();
  document.getElementById('remark-box').value = '';
  showToast(LABELS[currentLang].saveToast);
}

/* ============ Toast / clipboard ============ */
function showToast(text){
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  toast.classList.remove('hidden');
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.classList.add('hidden'), 250); }, 1800);
}
function copyText(text){
  navigator.clipboard.writeText(text).then(() => showToast(LABELS[currentLang].copyToast));
}

/* ============ Language toggle ============ */
function toggleLanguage(){
  currentLang = currentLang === 'bn' ? 'en' : 'bn';
  const bnBtn = document.getElementById('lang-bn');
  const enBtn = document.getElementById('lang-en');
  if (currentLang === 'en') {
    bnBtn.className = 'text-slate-500 px-2 py-1';
    enBtn.className = 'bg-white text-slate-800 px-2 py-1 rounded-full shadow-sm';
    document.documentElement.lang = 'en';
  } else {
    enBtn.className = 'text-slate-500 px-2 py-1';
    bnBtn.className = 'bg-white text-slate-800 px-2 py-1 rounded-full shadow-sm';
    document.documentElement.lang = 'bn';
  }
  applyStaticLabels();
  if (currentCustomerKey) renderCustomer();
  else showPage(currentPage); // keep the empty-state skeleton's own labels in sync with language even before a search
  renderRecent();
}

/* ============ Keyboard shortcuts ============ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
  if (e.key === '/' && document.activeElement.id !== 'search-input') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
  if (e.key === 'Escape') { closeAllDrawers(); closeSidebar(); }
});
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

/* ============ Init ============ */
lucide.createIcons();
applyStaticLabels();
switchTab('orders'); // mounts the Orders page skeleton; render calls stay skipped until a customer loads
refreshRecentFromAPI();
</script>
