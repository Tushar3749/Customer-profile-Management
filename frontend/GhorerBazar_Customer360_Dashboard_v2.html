      gbIdentity: '#378ADD', gbTrust: '#639922', gbRisk: '#E24B4A',

<style>
  /* ================================================================
     DESIGN TOKENS — one scale each for type, motion, focus and press.
     Everything else in this file (Tailwind utilities included) should
     read from these rather than inventing a new value.
     ================================================================ */

  /* ---- Type scale: 6 tiers, replaces every text-[Npx] arbitrary value
     and the old !important size override. Weight is NOT baked in here
     (that would fight Tailwind's own font-* utilities on cascade order) —
     each tier pairs with an explicit Tailwind weight class at the call
     site: micro→font-semibold(+ .label-micro for uppercase labels),
     body→font-medium, card-title/subheading/heading/hero→font-bold. */
  .text-micro       { font-size: 11px; line-height: 1.4; }
  .label-micro       { font-size: 11px; line-height: 1.4; text-transform: uppercase; letter-spacing: .04em; }
  .text-body        { font-size: 12px; line-height: 1.5; }
  .text-card-title  { font-size: 14px; line-height: 1.4; }
  .text-subheading  { font-size: 16px; line-height: 1.45; }
  .text-heading     { font-size: 20px; line-height: 1.3; }
  .text-hero        { font-size: 26px; line-height: 1.2; }

  /* ---- Motion scale: 3 tiers. fast = hover/press feedback, medium =
     drawers/toast, slow = chart grow-in. */
  :root{ --dur-fast:.15s; --dur-medium:.3s; --dur-slow:.7s; }

  /* ---- Focus & press: one rule each, covers every interactive element
     (native buttons/links/inputs, plus anything with tabindex) instead of
     repeating a ring utility at 30+ call sites. */
  :focus-visible{ outline: 2px solid #378ADD !important; outline-offset: 2px !important; border-radius: 6px; }
  button, [onclick]{ transition: transform var(--dur-fast) ease, filter var(--dur-fast) ease, background-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease; }
  button:active, [onclick]:active{ transform: scale(.97); filter: brightness(.97); }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* ---- Shared button system: solid / outline / icon variants. Replaces
     one-off button styling at each call site (search, save, FAB, show-more,
     call-outcome). Color is set per-instance via the gb* Tailwind color
     utilities already on the element (bg-gbIdentity, border-gbTrust, …). */
  .gb-btn{
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-weight: 700; border-radius: 9999px; cursor: pointer; border: 1px solid transparent;
    transition: transform var(--dur-fast) ease, filter var(--dur-fast) ease, background-color var(--dur-fast) ease;
  }
  .gb-btn:hover{ filter: brightness(1.06); }
  .gb-btn-solid{ color: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.08); }
  .gb-btn-solid:hover{ filter: brightness(.92); }
  .gb-btn-outline{ background: transparent; }
  .gb-btn-icon{ border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; }

  .tier-gold-edge { border-left: 6px solid #EF9F27; background: linear-gradient(135deg, rgba(239,159,39,0.05) 0%, rgba(255,255,255,1) 100%); }
  .tier-green-edge { border-left: 6px solid #639922; background: linear-gradient(135deg, rgba(99,153,34,0.05) 0%, rgba(255,255,255,1) 100%); }
  .tier-red-edge { border-left: 6px solid #E24B4A; background: linear-gradient(135deg, rgba(226,75,74,0.05) 0%, rgba(255,255,255,1) 100%); }

  .heatmap-grid { display: grid; grid-template-rows: repeat(7, 21px); grid-auto-flow: column; grid-auto-columns: 21px; gap: 5px; }
  .heatmap-cell { width: 21px; height: 21px; border-radius: 4px; border: 0.5px solid rgba(0,0,0,0.08); cursor: pointer; transition: transform var(--dur-fast); display: flex; align-items: center; justify-content: center; }
  .heatmap-cell:hover { transform: scale(1.3); outline: 1.5px solid #334155; z-index: 5; position: relative; }
  .heatmap-date { font-size: 9px; line-height: 1; font-weight: 700; opacity: .55; pointer-events: none; user-select: none; }
  .heatmap-date.on-dark { color: #ffffff; }
  .heatmap-date.on-light { color: #0f172a; }
  #heatmap-tooltip { transition: opacity var(--dur-fast) ease; }

  /* Lightweight CSS-only charts (bars/donuts) — no charting library. Each
     starts at 0 and is grown to its data-grow-* target on next frame so
     the fill animates in instead of appearing static. All grow-in charts
     share one duration (--dur-slow). */
  .chart-bar-fill { transition: height var(--dur-slow) cubic-bezier(.22,.9,.35,1), width var(--dur-slow) cubic-bezier(.22,.9,.35,1); }
  .donut-seg { transition: stroke-dasharray var(--dur-slow) ease; }
  .pop-bar-fill { transition: width var(--dur-slow) cubic-bezier(.22,.9,.35,1); }

  #toast { transition: opacity var(--dur-medium), transform var(--dur-medium); }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px);} to {opacity:1; transform:translateY(0);} }

  .filter-hidden { display: none !important; }
  .chevron-rot { transform: rotate(180deg); }
  .metric-strip-item { min-width: 110px; }

/* ===== Customer 360 agent-friendly shell ===== */
:root{--gb-sidebar:250px;--gb-border:#e5eaf1;--gb-bg:#f6f8fb;--gb-text:#1f2937;--gb-muted:#64748b}
html,body{min-height:100%;background:var(--gb-bg)}
body{font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",Segoe UI,sans-serif!important;color:var(--gb-text);font-size:14px;line-height:1.55;overflow-x:hidden}
.gb-left-nav{position:fixed;inset:0 auto 0 0;width:var(--gb-sidebar);height:100vh;background:#fff;border-right:1px solid var(--gb-border);z-index:60;display:flex;flex-direction:column;box-shadow:4px 0 18px rgba(15,23,42,.05);transition:transform var(--dur-medium) ease}
.gb-left-brand{padding:22px 18px 18px;border-bottom:1px solid var(--gb-border)}
.gb-left-brand .brand-mark{width:38px;height:38px;border-radius:11px;background:#378ADD;color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.04em}
.gb-left-brand h2{font-size:16px;font-weight:800;margin:0;color:#0f172a}.gb-left-brand p{font-size:11px;color:#94a3b8;margin:3px 0 0}
.gb-left-menu{padding:14px 10px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.gb-left-item{width:100%;border:0;background:transparent;color:#475569;border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:11px;text-align:left;font-size:14px;font-weight:650;cursor:pointer;transition:.16s ease}
.gb-left-item:hover{background:#f1f5f9;color:#1e293b}.gb-left-item.active{background:#eaf3ff;color:#1769aa;box-shadow:inset 3px 0 #378ADD}.gb-left-item i{width:18px;height:18px;flex:none}
.gb-left-help{margin:auto 10px 14px;padding:12px;border:1px solid #dbeafe;background:#eff6ff;border-radius:10px;color:#1e5b96;font-size:11px;line-height:1.55}
.gb-left-help strong{display:block;font-size:12px;margin-bottom:3px}
body>header{margin-left:var(--gb-sidebar)!important;width:calc(100% - var(--gb-sidebar));box-sizing:border-box}
body>main{margin-left:var(--gb-sidebar)!important;margin-right:0!important;max-width:none!important;padding-left:28px!important;padding-right:28px!important;margin-top:24px!important}
/* Keep floating action button clear of the sidebar. */
body>.fixed.bottom-6.right-6{right:22px!important;bottom:22px!important;z-index:45!important}
body button{font-family:inherit}
body input{font-family:inherit;font-size:14px!important}
/* Breakpoints aligned to Tailwind's own lg(1024)/sm(640) steps instead of
   the two hand-picked 900/680 values this shell used before. */
@media(max-width:1024px){:root{--gb-sidebar:220px}body>header{padding-left:18px!important;padding-right:18px!important}body>main{padding-left:18px!important;padding-right:18px!important}}
/* Below sm(640px) the sidebar stops taking permanent width entirely — it
   becomes a hidden, hamburger-triggered overlay (see #sidebar-toggle-btn /
   toggleSidebar() / #sidebar-backdrop) instead of a permanently-visible
   190px column eating a third of a phone screen. */
@media(max-width:639px){
  :root{--gb-sidebar:250px}
  .gb-left-nav{transform:translateX(-100%)}
  .gb-left-nav.open{transform:translateX(0)}
  body>header{margin-left:0!important;width:100%!important;padding-left:14px!important;padding-right:14px!important}
  body>main{margin-left:0!important;padding-left:14px!important;padding-right:14px!important}
  #sidebar-backdrop.open{display:block}
}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:55}

</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">
  <!-- Permanent left navigation: visual-only shell; existing switchTab() remains the source of truth. -->
  <aside class="gb-left-nav" aria-label="Customer sections">
    <div class="gb-left-brand">
      <div class="flex items-center gap-3">
        <div class="brand-mark">GB</div>
        <div><h2>কাস্টমার তথ্য</h2><p>প্রয়োজনীয় তথ্য এক জায়গায়</p></div>
      </div>
    </div>
    <nav class="gb-left-menu">
      <button type="button" class="gb-left-item active" data-side-tab="orders" onclick="switchTab('orders');closeSidebar()"><i data-lucide="package"></i><span data-i18n="tabOrders">অর্ডারসমূহ</span></button>
      <button type="button" class="gb-left-item" data-side-tab="products" onclick="switchTab('products');closeSidebar()"><i data-lucide="shopping-bag"></i><span data-i18n="tabProducts">পণ্য পছন্দ</span></button>
      <button type="button" class="gb-left-item" data-side-tab="calls" onclick="switchTab('calls');closeSidebar()"><i data-lucide="phone-call"></i><span data-i18n="tabCalls">কল হিস্ট্রি</span></button>
      <button type="button" class="gb-left-item" data-side-tab="ai" onclick="switchTab('ai');closeSidebar()"><i data-lucide="sparkles"></i><span>AI সারাংশ</span></button>
      <button type="button" class="gb-left-item" data-side-tab="delivery" onclick="switchTab('delivery');closeSidebar()"><i data-lucide="truck"></i><span data-i18n="tabDelivery">ডেলিভারি তথ্য</span></button>
      <button type="button" class="gb-left-item" data-side-tab="channel" onclick="switchTab('channel');closeSidebar()"><i data-lucide="credit-card"></i><span data-i18n="tabChannel">চ্যানেল ও পেমেন্ট</span></button>
    </nav>
    <div class="gb-left-help"><strong>এজেন্টের জন্য</strong>কাস্টমার খুঁজে তার অর্ডার, পণ্য পছন্দ, কলের তথ্য ও AI সারাংশ এক জায়গা থেকে দেখুন।</div>
  </aside>
  <div id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 py-3 flex items-center justify-between shadow-sm gap-4">
    <div class="flex items-center gap-3 shrink-0">
      <button type="button" id="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Menu" class="sm:hidden gb-btn-icon w-9 h-9 text-slate-600 hover:bg-slate-100 shrink-0">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="bg-amber-500 text-white p-2 rounded-lg font-bold text-heading tracking-wider">GB</div>
      <span class="font-bold text-subheading text-slate-800 hidden md:inline">GhorerBazar <span class="text-body font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded">Customer 360°</span></span>
    </div>

    <div class="flex-1 max-w-md relative">
      <div class="relative">
        <i data-lucide="search" class="absolute left-3 top-2.5 h-4 w-4 text-slate-500 pointer-events-none"></i>
        <input id="search-input" type="text" placeholder="ফোন নম্বর দিয়ে খুঁজুন... (Ctrl+K)"
          class="w-full pl-9 pr-16 py-2 border border-slate-300 rounded-full text-card-title focus:outline-none focus:ring-2 focus:ring-gbIdentity/50 transition">
        <button onclick="doSearch()" class="gb-btn gb-btn-solid absolute right-1.5 top-1 bg-gbIdentity text-body px-3 py-1.5" data-i18n="searchBtn">খুঁজুন</button>
      </div>
      <div id="search-error" class="hidden absolute mt-1 text-body text-gbRisk bg-white border border-gbRisk/30 rounded-lg px-3 py-1.5 shadow-sm font-medium"></div>
      <div class="flex items-center gap-1.5 mt-1.5 flex-wrap text-micro">
        <span class="text-slate-500" data-i18n="recentLabel">সাম্প্রতিক:</span>
        <span id="recent-chips" class="flex gap-1.5 flex-wrap"></span>
      </div>
    </div>

    <div class="flex items-center gap-4 shrink-0">
      <button onclick="toggleLanguage()" class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-full p-1 text-body font-semibold hover:bg-slate-200 transition">
        <span id="lang-bn" class="bg-white text-slate-800 px-2 py-1 rounded-full shadow-sm">বাং</span>
        <span id="lang-en" class="text-slate-500 px-2 py-1">EN</span>
      </button>
      <div class="h-4 w-[1px] bg-slate-200 hidden sm:block"></div>
      <div class="items-center gap-2 hidden sm:flex">
        <div class="w-8 h-8 rounded-full bg-gbIdentity text-white flex items-center justify-center font-bold text-card-title">RH</div>
        <div class="text-body font-medium">
          <p class="font-bold text-slate-700">রাকিব হাসান</p>
          <p class="text-slate-500">Agent #104</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 mt-6 space-y-4">

    <!-- Minimal context strip — the ONLY customer info shared across every
         page. Full identity (badges, address, reliability, due, AI summary)
         lives on the AI Summary page only; see renderIdentityCard(). -->
    <div id="context-strip" class="bg-white rounded-lg shadow-sm border border-slate-200 px-4 py-2.5 flex items-center gap-2 flex-wrap">
      <i data-lucide="user-round" class="w-4 h-4 text-gbIdentity shrink-0"></i>
      <span id="ctx-cust-name" class="text-card-title font-bold text-slate-800"></span>
      <span class="text-slate-300">•</span>
      <span id="ctx-cust-phone" class="text-body font-medium font-mono text-slate-500"></span>
    </div>

    <!-- Each page's entire markup is generated fresh into here by showPage()
         — only the active page's elements/ids exist in the DOM at any time. -->
    <div id="page-container"></div>
  </main>

  <!-- Agent Action Panel -->
  <div class="fixed bottom-6 right-6 z-40">
    <button onclick="toggleActionPanel()" class="gb-btn gb-btn-solid bg-gbIdentity p-4 rounded-full shadow-lg">
      <i data-lucide="edit-3" class="w-5 h-5"></i><span data-i18n="actionPanelBtn">অ্যাকশন প্যানেল</span>
    </button>
  </div>

  <div id="action-drawer" class="fixed inset-y-0 right-0 w-80 md:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between">
    <div>
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="font-bold text-subheading text-slate-800 flex items-center gap-2"><i data-lucide="phone-outgoing" class="w-5 h-5 text-gbIdentity"></i> <span data-i18n="actionPanelTitle">কল রেজাল্ট সেভ করুন</span></h3>
        <button onclick="toggleActionPanel()" class="text-slate-500 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-body font-bold text-slate-700 mb-2" data-i18n="callStatusLabel">কলের স্ট্যাটাস</label>
          <div class="grid grid-cols-2 gap-2">
            <button class="status-btn gb-btn gb-btn-outline border border-slate-200 text-body py-2 rounded-lg hover:border-gbTrust hover:text-gbTrust" data-i18n="statusInterested">Interested</button>
            <button class="status-btn gb-btn gb-btn-outline border border-slate-200 text-body py-2 rounded-lg hover:border-gbRisk hover:text-gbRisk" data-i18n="statusNotInterested">Not Interested</button>
            <button class="status-btn gb-btn gb-btn-outline border border-slate-200 text-body py-2 rounded-lg hover:border-slate-400" data-i18n="statusUnreachable">Unreachable</button>
            <button class="status-btn gb-btn gb-btn-outline border border-slate-200 text-body py-2 rounded-lg hover:border-gbVIP hover:text-gbVIP" data-i18n="statusCallback">Callback Request</button>
          </div>
        </div>
        <div>
          <label class="block text-body font-bold text-slate-700 mb-1" data-i18n="remarkLabel">এজেন্ট রিমার্ক (Remark)</label>
          <textarea id="remark-box" rows="3" data-i18n-placeholder="remarkPlaceholder" placeholder="কাস্টমারের সাথে আলোচনার সংক্ষিপ্ত বিবরণ লিখুন..." class="w-full border border-slate-300 rounded-lg p-2 text-body focus:ring-2 focus:ring-gbIdentity focus:outline-none font-medium"></textarea>
        </div>
        <div>
          <label class="block text-body font-bold text-slate-700 mb-1" data-i18n="followupLabel">পরবর্তী ফলো-আপ তারিখ</label>
          <input type="date" class="w-full border border-slate-300 rounded-lg p-2 text-body text-slate-600 font-medium">
        </div>
      </div>
    </div>
    <button onclick="saveAction()" class="gb-btn gb-btn-solid w-full bg-gbTrust py-3 rounded-lg text-card-title shadow-md">
      <i data-lucide="check-circle" class="w-4 h-4"></i> <span data-i18n="saveBtn">সংরক্ষণ করুন</span>
    </button>
  </div>

  <!-- Day detail drawer -->
  <div id="day-drawer" class="fixed inset-y-0 right-0 w-80 md:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 p-6 overflow-y-auto">
    <div class="flex justify-between items-center border-b pb-3 mb-4">
      <h3 class="font-bold text-subheading text-slate-800 flex items-center gap-2"><i data-lucide="calendar-days" class="w-5 h-5 text-gbTrust"></i> <span id="day-drawer-title"></span></h3>
      <button onclick="closeDayDrawer()" class="text-slate-500 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="day-drawer-content" class="space-y-3 text-card-title"></div>
  </div>
  <div id="drawer-backdrop" onclick="closeAllDrawers()" class="hidden fixed inset-0 bg-black/20 z-40"></div>

  <!-- Heatmap hover tooltip: custom styled popup (replaces the native title-attribute
       tooltip) so it can show multi-line real per-day stats. Positioned in JS by
       showHeatmapTooltip()/positionHeatmapTooltip(); pointer-events:none so it never
       steals the mouseleave from the cell underneath. -->
  <div id="heatmap-tooltip" class="hidden fixed z-[80] bg-slate-800 text-white text-body rounded-lg shadow-lg px-3 py-2 pointer-events-none max-w-[230px] font-medium"></div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-card-title px-4 py-2.5 rounded-lg shadow-lg z-[60] flex items-center gap-2">
    <i data-lucide="check" class="w-4 h-4"></i><span id="toast-text"></span>
  </div>

  <!-- Loading overlay (API fetch in progress) -->
  <div id="loading-overlay" class="hidden fixed inset-0 bg-white/60 z-[70] flex items-center justify-center">
    <div class="flex items-center gap-2 bg-white shadow-lg rounded-full px-4 py-2.5 border border-slate-200">
      <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-gbIdentity"></i>
      <span class="text-card-title font-semibold text-slate-600" id="loading-text">Loading...</span>
    </div>
  </div>

<script>
/* ============ i18n labels ============ */
const LABELS = {
  bn: {
    searchBtn:'খুঁজুন', recentLabel:'সাম্প্রতিক:', dueLabel:'বকেয়া পরিমাণ', reliabilityLabel:'রিলায়েবিলিটি স্কোর',
    mTotalOrders:'মোট অর্ডার', mTotalOrdersTrend:'↑ ৫% গড়ের চেয়ে বেশি',
    mLtv:'লাইফটাইম ভ্যালু', mLtvSub:'Top 5% Customer',
    mAov:'AOV (গড় অর্ডার)', mAovSub:'↑ স্ট্যাবল',
    mCancelRate:'বাতিলের হার', mCancelSub:'নিচে ক্লিক করে ফিল্টার দেখুন',
    mReturnRate:'রিটার্ন হার', mReturnSub:'নিচে ক্লিক করে ফিল্টার দেখুন',
    mLastOrder:'সর্বশেষ অর্ডার',
    orderHeatmapTitle:'অর্ডার অ্যাক্টিভিটি (গত ৩ মাস)', callHeatmapTitle:'কল অ্যাক্টিভিটি ও রেসপন্স (গত ৩ মাস)',
    low:'কম', high:'বেশি', negative:'নেগেটিভ', positive:'পজিটিভ',

/* ============ Live cache, populated from GET /api/customer/{phone} ============ */
const CUSTOMERS = {};

// Every status/chart color in the app draws from these 7 hex values (the
// same ones tailwind.config declares as gbIdentity/gbTrust/etc.) instead of
// each chart/icon inventing its own Tailwind-stock or one-off hex. "warning"
// (gbVIP) is used as an icon/chart fill only, never as white-on-color badge
// text — at that weight gbVIP itself is only ~2.2:1 against white, so the
// one badge that needs to *read* as amber (intransit/other, below) uses the
// darker amber-700 Tailwind class instead, which clears WCAG AA (~5:1).
const CHART_COLORS = {
  positive: '#639922', // gbTrust
  negative: '#E24B4A', // gbRisk
  warning:  '#EF9F27', // gbVIP
  neutral:  '#378ADD', // gbIdentity
  products: '#D85A30', // gbProducts
  call:     '#7F77DD', // gbCall
  delivery: '#1D9E75', // gbDelivery
};

const TIER_CLASS = {gold:'tier-gold-edge', green:'tier-green-edge', red:'tier-red-edge'};
// `border` is a single left-side color utility (border-l-{color}), paired
// on the card with neutral top/right/bottom borders and a thicker
// border-l-4 — status color shows only as that left accent + the badge
// (`cls`), deliberately not a full tinted background, to keep the order
// list subtle. (Deliberately not combined with a plain `border-slate-200`,
// which sets border-color on all 4 sides and would race the left-side
// override for which color wins.)
const STATUS_STYLE = {
  delivered:{cls:'bg-emerald-600 text-white shadow-sm', key:'statusDelivered', border:'border-l-emerald-600', icon:'check-circle-2', iconBg:CHART_COLORS.positive+'1A', iconColor:CHART_COLORS.positive, chartColor:CHART_COLORS.positive},
  cancelled:{cls:'bg-red-600 text-white shadow-sm', key:'statusCancelled', border:'border-l-red-600', icon:'x-circle', iconBg:CHART_COLORS.negative+'1A', iconColor:CHART_COLORS.negative, chartColor:CHART_COLORS.negative},
  returned:{cls:'bg-purple-600 text-white shadow-sm', key:'statusReturned', border:'border-l-purple-600', icon:'rotate-ccw', iconBg:CHART_COLORS.call+'1A', iconColor:CHART_COLORS.call, chartColor:CHART_COLORS.call},
  // amber-700 (not -500) so the white badge text clears WCAG AA — see the
  // CHART_COLORS comment above.
  intransit:{cls:'bg-amber-700 text-white shadow-sm', key:'statusInTransit', border:'border-l-amber-700', icon:'truck', iconBg:CHART_COLORS.warning+'1A', iconColor:CHART_COLORS.warning, chartColor:CHART_COLORS.warning},
};
// Source data has ~29 raw status spellings (case/underscore/hyphen variants
// plus lifecycle states like PENDING/PROCESSING/APPROVED the backend
// doesn't bucket into the 4 known ones above) — any of those must render
// as a plain "other" chip instead of throwing, or renderOrders() aborts
// mid-list and every render call after it (products/calls/delivery/
// channel) silently never runs. Styled the same amber/"in progress" as
// intransit, since an unrecognized lifecycle status is presumably some
// pre-delivery state, not a final delivered/cancelled/returned one.
const STATUS_STYLE_OTHER = {cls:'bg-amber-700 text-white shadow-sm', key:null, border:'border-l-amber-700', icon:'truck', iconBg:CHART_COLORS.warning+'1A', iconColor:CHART_COLORS.warning, chartColor:CHART_COLORS.warning};

/* ============ Rendering helpers ============ */
function fmtMoney(n){ return '৳ ' + n.toLocaleString('en-US'); }

function applyStaticLabels(){
  const L = LABELS[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (L[k]) el.textContent = L[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const k = el.getAttribute('data-i18n-placeholder');
    if (L[k]) el.setAttribute('placeholder', L[k]);
  });
  document.getElementById('search-input').placeholder = currentLang==='bn' ? 'ফোন নম্বর দিয়ে খুঁজুন... (Ctrl+K)' : 'Search by phone number... (Ctrl+K)';
}

/* metricChip() removed — every summary strip now uses orderSummaryCard()'s
   icon-circle pattern instead of two competing "stat" components. */

// Runs on every page, for every customer load/language toggle — the one
// piece of customer info that's genuinely shared chrome, not a page's content.
function renderContextStrip(c, L){
  document.getElementById('ctx-cust-name').textContent = c.name;
  document.getElementById('ctx-cust-phone').textContent = c.phone;
}

// Full identity card (name/address/badges/reliability/due) + AI summary.
// Only called when the AI Summary page is the one actually in the DOM —
// every id here lives exclusively on that page now, not shared chrome.
function renderIdentityCard(c, L){
  const Lb = LABELS[L];

  document.getElementById('snapshot-card').className = 'bg-white rounded-xl shadow-sm p-6 relative ' + TIER_CLASS[c.tier];
  document.getElementById('cust-name').textContent = c.name;
  document.getElementById('cust-phone').textContent = c.phone;
  const primary = c.addresses.find(a=>a.primary) || c.addresses[0];
  document.getElementById('cust-address').textContent = primary[L];
  document.getElementById('cust-address-extra').textContent = c.addresses.length > 1 ? `+${c.addresses.length - 1}${Lb.addressesLabel}` : '';
  document.getElementById('cust-segment').textContent = c.segment[L];
  document.getElementById('cust-segment').className = 'text-micro font-bold px-2 py-0.5 rounded-full text-white ' +
    (c.tier==='gold' ? 'bg-gbVIP' : c.tier==='green' ? 'bg-gbTrust' : 'bg-gbRisk');
  document.getElementById('cust-tenure').textContent = c.tenure[L];
  document.getElementById('cust-contact-time').textContent = c.preferredContactTime[L];
  document.getElementById('cust-top-category').textContent = c.topCategory[L];

  document.getElementById('due-chip').style.display = c.due > 0 ? 'flex' : 'none';
  document.getElementById('due-amount').textContent = fmtMoney(c.due);

  // Reliability gauge
  const score = c.reliabilityScore;
  const color = score >= 70 ? '#639922' : score >= 40 ? '#EF9F27' : '#E24B4A';
  const circumference = 2 * Math.PI * 18;
  const ring = document.getElementById('reliability-ring');
  ring.setAttribute('stroke', color);
  ring.setAttribute('stroke-dasharray', circumference);
  ring.setAttribute('stroke-dashoffset', circumference - (score/100)*circumference);
  const scoreEl = document.getElementById('reliability-score');
  scoreEl.textContent = score + '/100';
  scoreEl.style.color = color;

  // Badges (base + consent + escalation)
  const badgeRow = document.getElementById('badge-row');
  let badgesHtml = c.badges.map(b => `
    <span onclick="${b.filter ? `switchTab('orders','${b.filter}')` : `switchTab('orders')`}"
      class="cursor-pointer bg-${b.color}/10 text-${b.color} border border-${b.color}/30 text-body font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 hover:bg-${b.color}/20">
      <i data-lucide="${b.icon}" class="w-3.5 h-3.5"></i> ${b.label[L]}
    </span>`).join('');
  if (c.consent === 'given') {
    badgesHtml += `<span class="bg-gbTrust/10 text-gbTrust border border-gbTrust/30 text-body font-semibold px-2.5 py-1 rounded-full flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i> ${Lb.consentGiven}</span>`;
  } else if (c.consent === 'donotcall') {
    badgesHtml += `<span class="bg-gbRisk/10 text-gbRisk border border-gbRisk/30 text-body font-semibold px-2.5 py-1 rounded-full flex items-center gap-1"><i data-lucide="shield-off" class="w-3.5 h-3.5"></i> ${Lb.doNotCall}</span>`;
  }
  if (c.callStats.unreachableStreak >= 4) {
    badgesHtml += `<span onclick="switchTab('calls')" class="cursor-pointer bg-gbRisk/10 text-gbRisk border border-gbRisk/30 text-body font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 animate-pulse"><i data-lucide="flag" class="w-3.5 h-3.5"></i> ${Lb.escalationNeeded}</span>`;
  }
  badgeRow.innerHTML = badgesHtml;

  // Interested-in cross-sell tags
  const interestRow = document.getElementById('interest-row');
  if (c.interestedIn[L].length) {
    interestRow.innerHTML = `<span class="text-micro text-slate-500 font-semibold">${Lb.interestedInLabel}</span>` +
      c.interestedIn[L].map(t => `<span class="text-micro bg-gbProducts/10 text-gbProducts border border-gbProducts/20 px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="tag" class="w-3 h-3"></i>${t}</span>`).join('');
  } else {
    interestRow.innerHTML = '';
  }

  // AI summary
  const aiToggleBtn = document.getElementById('ai-summary-toggle-label').closest('button');
  if (!c.hasAiSummary) {
    // No background-job row for this customer yet — a real, expected
    // state (not a fetch/connection failure), so show a neutral notice
    // instead of an empty '""' or any error-styled message.
    document.getElementById('ai-summary-short').textContent =
      currentLang==='bn' ? 'এখনো AI সারাংশ তৈরি হয়নি।' : 'AI summary not generated yet.';
    document.getElementById('ai-summary-full').classList.add('hidden');
    document.getElementById('ai-summary-full').innerHTML = '';
    if (aiToggleBtn) aiToggleBtn.classList.add('hidden');
  } else {
    if (aiToggleBtn) aiToggleBtn.classList.remove('hidden');
    document.getElementById('ai-summary-short').textContent = '"' + c.aiSummaryShort[L] + '"';
    document.getElementById('ai-summary-full').classList.add('hidden');
    document.getElementById('ai-summary-chevron').classList.remove('chevron-rot');
    document.getElementById('ai-summary-toggle-label').textContent =
      (currentLang==='bn' ? `${Lb.aiDetailsShow} (${c.notesCount}টি নোট থেকে প্রাপ্ত)` : `${Lb.aiDetailsShow} (from ${c.notesCount} notes)`);
    document.getElementById('ai-summary-full').innerHTML = c.aiSummaryFull[L].map(note => `
      <p class="text-body text-slate-600 bg-white/70 border border-purple-100 rounded-lg p-2 font-medium">${note}</p>`).join('');
  }
}

// The 6 top-level metric tiles — order-derived, so they live on the Orders
// page only now instead of repeating above every page.
function renderOrdersMetrics(c, L){
  document.getElementById('m-total-orders').textContent = c.metrics.totalOrders + (L==='bn' ? 'টি' : '');
  document.getElementById('m-ltv').textContent = fmtMoney(c.metrics.ltv);
  document.getElementById('m-aov').textContent = fmtMoney(c.metrics.aov);
  document.getElementById('m-cancel-rate').textContent = c.metrics.cancelRate + '%';
  document.getElementById('m-return-rate').textContent = c.metrics.returnRate + '%';
  document.getElementById('m-recency').textContent = c.metrics.recencyDays + (L==='bn' ? ' দিন' : ' days');
  document.getElementById('m-last-order-date').textContent = c.metrics.lastOrderDate[L];
}

// Entry point called by loadCustomerFromAPI()/toggleLanguage() — updates the
// shared context strip, then re-renders whichever page is currently active
// (showPage() rebuilds that page's DOM and calls its render function).
function renderCustomer(){
  const c = CUSTOMERS[currentCustomerKey];
  const L = currentLang;
  renderContextStrip(c, L);
  expandedOrderInvoice = c.orders.length ? c.orders[0].invoice : null;
  showPage(currentPage);
}

/* ============ Orders (summary cards, compact list, expand-to-detail) ============ */
function computeOrderStats(c){
  const delivered = c.orders.filter(o=>o.status==='delivered').length;
  const cancelled = c.orders.filter(o=>o.status==='cancelled').length;
  const returned = c.orders.filter(o=>o.status==='returned').length;
  const topMethod = c.paymentBreakdown[0] || { label: bnEn(''), pct: 0 };
  return { invoiceCount: c.orders.length, delivered, cancelled, returned, topMethod };
}

function orderTotal(o){ return o.items.reduce((s,i)=>s+i.qty*i.unitPrice,0) + o.deliveryFee; }

// Total sales / unique products / total quantity across this customer's
// FULL order list (not just the 5 shown before "আরও দেখুন") — the
// summary card at the top of the tab always reflects everything, not
// just what's currently on screen.
function computeOrdersSummary(orders){
  let totalSales = 0;
  let totalQty = 0;
  const productKeys = new Set();
  orders.forEach(o => {
    totalSales += orderTotal(o);
    o.items.forEach(it => {
      totalQty += it.qty;
      // ProductSKU is NULL on some real TestMaster rows, so fall back to
      // the product name so those items still count as a distinct product.
      productKeys.add(it.sku || `name:${it.name.bn}|${it.name.en}`);
    });
  });
  return { totalSales, totalQty, uniqueProducts: productKeys.size };
}

/* Grows any freshly-inserted CSS-only chart bars/donut segments from 0 to
   their real data-grow-* target over the next frame, so charts animate in
   on render instead of appearing instantly static. Double-rAF so the
   browser has committed the 0-state style before the transition starts. */
function triggerChartGrow(root){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll('[data-grow-height]').forEach(el => { el.style.height = el.dataset.growHeight; });
    root.querySelectorAll('[data-grow-width]').forEach(el => { el.style.width = el.dataset.growWidth; });
    root.querySelectorAll('[data-grow-dasharray]').forEach(el => { el.setAttribute('stroke-dasharray', el.dataset.growDasharray); });
  }));
}

/* Shared "breakdown bar list" — one row per item, grow-in width animation,
   exact value revealed on hover. Used by Calls status breakdown, Channel
   breakdown and Payment breakdown, so all three flat lists share the same
   chart language as the Orders/Products charts instead of a separate
   static, no-animation, single-color bar style. */
function renderBreakdownBars(items, L, colorHex, emptyText){
  if (!items || !items.length) return `<p class="text-body font-medium text-slate-500">${emptyText}</p>`;
  return items.map(item => `
    <div class="mb-2.5 group relative">
      <div class="flex justify-between text-body font-medium text-slate-600 mb-1">
        <span>${item.label}</span>
        <span class="font-bold text-slate-700">${item.pct}%</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
        <div class="chart-bar-fill h-full rounded-full" style="width:0%;background:${colorHex}" data-grow-width="${item.pct}%"></div>
      </div>
      <div class="hidden group-hover:block absolute -top-1 left-1/2 -translate-x-1/2 -translate-y-full bg-slate-800 text-white text-micro font-semibold rounded-lg px-2.5 py-1 whitespace-nowrap z-10 shadow-lg pointer-events-none">${item.detail}</div>
    </div>`).join('');
}

/* ---- Orders: monthly trend bar chart + status distribution donut ---- */
function computeMonthlyOrderTrend(orders, L){
  const today = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    months.push({
      key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
      label: d.toLocaleDateString(L==='bn' ? 'bn-BD' : 'en-US', {month:'short'}),
      count: 0, sales: 0,
    });
  }
  const byKey = Object.fromEntries(months.map(m => [m.key, m]));
  orders.forEach(o => {
    // Order dates are a plain YYYY-MM-DD string from the backend (see the
    // heatmap grouping above) — slicing avoids a Date() timezone round-trip.
    const key = rawDateKey(o.date && (o.date.bn || o.date.en));
    if (!key) return;
    const m = byKey[key.slice(0, 7)];
    if (m) { m.count += 1; m.sales += orderTotal(o); }
  });
  return months;
}

function renderMonthlyOrderChart(c, L){
  const months = computeMonthlyOrderTrend(c.orders, L);
  const maxSales = Math.max(1, ...months.map(m => m.sales));
  const bars = months.map(m => {
    const pct = Math.round((m.sales / maxSales) * 100);
    return `
    <div class="flex flex-col items-center gap-1 flex-1 min-w-0 group relative">
      <div class="hidden group-hover:block absolute bottom-full mb-1.5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-micro rounded-lg px-2.5 py-1.5 whitespace-nowrap z-10 shadow-lg pointer-events-none">
        ${m.count} ${L==='bn'?'অর্ডার':'orders'} · ${fmtMoney(m.sales)}
      </div>
      <span class="text-micro font-bold text-slate-500">${m.count}</span>
      <div class="w-full h-28 flex items-end bg-slate-50 rounded-lg overflow-hidden cursor-default">
        <div class="chart-bar-fill w-full bg-gbIdentity rounded-t-sm" style="height:0%" data-grow-height="${pct}%"></div>
      </div>
      <span class="text-micro text-slate-500 truncate">${m.label}</span>
    </div>`;
  }).join('');
  return `
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
    <p class="font-bold text-card-title text-slate-700 mb-3">📊 ${L==='bn'?'মাসিক অর্ডার ট্রেন্ড':'Monthly Order Trend'}</p>
    <div class="flex items-end gap-2">${bars}</div>
  </div>`;
}

function renderOrderStatusDonut(L, c, stats){
  const total = stats.invoiceCount || 0;
  const intransit = c.orders.filter(o => o.status === 'intransit').length;
  const otherCount = Math.max(0, total - stats.delivered - stats.cancelled - stats.returned - intransit);
  const segs = [
    { st: STATUS_STYLE.delivered, count: stats.delivered },
    { st: STATUS_STYLE.cancelled, count: stats.cancelled },
    { st: STATUS_STYLE.returned, count: stats.returned },
    { st: STATUS_STYLE.intransit, count: intransit },
    { st: STATUS_STYLE_OTHER, count: otherCount },
  ].filter(s => s.count > 0);

  const cardOpen = `<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
    <p class="font-bold text-card-title text-slate-700 mb-3">🎯 ${L==='bn'?'অর্ডার স্ট্যাটাস বিতরণ':'Order Status Distribution'}</p>`;
  if (!total) {
    return `${cardOpen}<p class="text-body text-slate-500 py-6 text-center font-medium">${LABELS[L].noDayData}</p></div>`;
  }

  const R = 40, C = 2 * Math.PI * R;
  let offset = 0;
  const circles = segs.map(s => {
    const len = (s.count / total) * C;
    const circle = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${s.st.chartColor}" stroke-width="14"
      stroke-dasharray="0 ${C.toFixed(2)}" data-grow-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}" class="donut-seg" transform="rotate(-90 50 50)"/>`;
    offset += len;
    return circle;
  }).join('');

  const legend = segs.map(s => `
    <div class="flex items-center justify-between text-body font-medium">
      <span class="flex items-center gap-1.5 text-slate-600"><span class="w-2.5 h-2.5 rounded-full inline-block shrink-0" style="background:${s.st.chartColor}"></span>${s.st.key ? LABELS[L][s.st.key] : (L==='bn'?'অন্যান্য':'Other')}</span>
      <span class="font-bold text-slate-700 shrink-0">${s.count} <span class="text-slate-500 font-normal">(${Math.round(s.count/total*100)}%)</span></span>
    </div>`).join('');

  return `${cardOpen}
    <div class="flex items-center gap-4">
      <svg viewBox="0 0 100 100" width="110" height="110" class="shrink-0">
        <circle cx="50" cy="50" r="${R}" fill="none" stroke="#f1f5f9" stroke-width="14"/>
        ${circles}
      </svg>
      <div class="flex-1 space-y-1.5 min-w-0">${legend}</div>
    </div>
  </div>`;
}

/* ============ Products (with return rate, metric strip, summary) ============ */
function computeProductStats(c){
  const uniqueProducts = c.products.length;
  const avgBasket = (c.orders.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0) / c.orders.length).toFixed(1);
  const highestOrder = Math.max(...c.orders.map(orderTotal));
  return { uniqueProducts, avgBasket, highestOrder };
}

/* ---- Products: top-5 popularity bar chart + optional category donut ---- */
function renderTopProductsBarChart(c, L){
  const top = c.products.slice().sort((a,b) => b.count - a.count).slice(0, 5);
  if (!top.length) return '';
  const maxCount = Math.max(1, ...top.map(p => p.count));
  // One brand token (gbTrust/CHART_COLORS.positive) at falling opacity,
  // rank 1 fading to rank 5 — not five separately-invented green hexes.
  const shades = ['FF', 'CC', '99', '77', '55'].map(alpha => CHART_COLORS.positive + alpha);
  const rows = top.map((p, i) => {
    const pct = Math.round((p.count / maxCount) * 100);
    return `
    <div class="flex items-center gap-2">
      <span class="w-4 shrink-0 text-micro font-bold text-slate-500">#${i+1}</span>
      <span class="w-24 shrink-0 text-body font-medium text-slate-600 truncate" title="${p.name[L]}">${p.name[L]}</span>
      <div class="flex-1 h-5 bg-slate-50 rounded-full overflow-hidden">
        <div class="chart-bar-fill h-full rounded-full flex items-center justify-end px-2" style="width:0%;background:${shades[i] || shades[shades.length-1]}" data-grow-width="${pct}%">
          <span class="text-micro font-bold text-white">${p.count}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
    <p class="font-bold text-card-title text-slate-700 mb-3">🏆 ${L==='bn'?'সবচেয়ে জনপ্রিয় প্রোডাক্ট':'Most Popular Products'}</p>
    <div class="space-y-2.5">${rows}</div>
  </div>`;
}

// Only renders if the backend ever starts sending a per-product category —
// it doesn't today (ProductPreference has no category field), so this
// stays an empty string rather than fabricating categories that aren't
// really in the data.
function renderCategoryDonut(c, L){
  const withCategory = c.products.filter(p => p.category);
  if (!withCategory.length) return '';
  const byCategory = {};
  withCategory.forEach(p => { byCategory[p.category] = (byCategory[p.category] || 0) + p.count; });
  const entries = Object.entries(byCategory).sort((a,b) => b[1] - a[1]);
  const total = entries.reduce((s, [,v]) => s + v, 0) || 1;
  // Generated from CHART_COLORS, not a second hardcoded re-list of the
  // same seven hex values.
  const palette = Object.values(CHART_COLORS);
  const R = 40, C = 2 * Math.PI * R;
  let offset = 0;
  const circles = entries.map(([, val], i) => {
    const color = palette[i % palette.length];
    const len = (val / total) * C;
    const circle = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${color}" stroke-width="14"
      stroke-dasharray="0 ${C.toFixed(2)}" data-grow-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}" class="donut-seg" transform="rotate(-90 50 50)"/>`;
    offset += len;
    return circle;
  }).join('');
  const legend = entries.map(([name, val], i) => `
    <div class="flex items-center justify-between text-body font-medium">
      <span class="flex items-center gap-1.5 text-slate-600"><span class="w-2.5 h-2.5 rounded-full inline-block shrink-0" style="background:${palette[i % palette.length]}"></span>${name}</span>
      <span class="font-bold text-slate-700 shrink-0">${Math.round(val/total*100)}%</span>
    </div>`).join('');
  return `
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
    <p class="font-bold text-card-title text-slate-700 mb-3">🍩 ${L==='bn'?'ক্যাটাগরি অনুযায়ী':'By Category'}</p>
    <div class="flex items-center gap-4">
      <svg viewBox="0 0 100 100" width="110" height="110" class="shrink-0"><circle cx="50" cy="50" r="${R}" fill="none" stroke="#f1f5f9" stroke-width="14"/>${circles}</svg>
      <div class="flex-1 space-y-1.5 min-w-0">${legend}</div>
    </div>
  </div>`;
}

function renderProducts(c, L){

      <div class="flex items-start gap-3 ${p.top ? 'mt-2' : ''}">

      <div class="mt-3">

    : `Most preferred: ${c.products[0].name.en} (${c.products[0].count}x).` + (worstRate > 0 ? ` ${worst.name.en} has the highest return rate (${worstRate}%) — be cautious suggesting it again.` : ' No product has a notable return rate.');

/* ============ Calls (metric strip, timeline, cached-AI pattern summary) ============ */
const CALL_STATUS_DOT = { positive:'bg-gbTrust', follow:'bg-gbVIP', negative:'bg-gbRisk' };

// Thresholds are a simple, adjustable if/else read of call_status_breakdown
// (already fetched — no AI call needed). Not a business-confirmed cutoff,
// just a reasonable "is this the dominant outcome" bar; tune freely.
// Scoped narrowly to this one pattern check — deliberately not reusing
// NEGATIVE_CALL_STATUSES/POSITIVE_CALL_STATUSES (defined further below,
// used for the per-entry status dot color) since those also lump in
// "Not Interested"/"Interested", which this function treats as its own
// distinct pattern rather than folding into "unreachable"/"orders".
const CALL_PATTERN_THRESHOLD_PCT = 30;
const CALL_PATTERN_UNREACHABLE_STATUSES = ['Unreachable', 'Switch Off'];
const CALL_PATTERN_ORDER_STATUSES = ['Order Placed', 'Recently Ordered'];

function computeCallPatternSummary(breakdown, L){
  const Lb = LABELS[L];
  const fmt = (key, vars) => Object.keys(vars || {}).reduce(
    (s, k) => s.replace(`{${k}}`, vars[k]), Lb[key]);
  if (!breakdown || !breakdown.length) return fmt('patternNoData');

  const top = breakdown[0]; // backend already sorts by count DESC
  if (CALL_PATTERN_UNREACHABLE_STATUSES.includes(top.status) && top.pct >= CALL_PATTERN_THRESHOLD_PCT) {
    return fmt('patternMostlyUnreachable');
  }
  if (CALL_PATTERN_ORDER_STATUSES.includes(top.status) && top.pct >= CALL_PATTERN_THRESHOLD_PCT) {
    return fmt('patternRegularOrders');
  }
  if (top.status === 'Not Interested' && top.pct >= CALL_PATTERN_THRESHOLD_PCT) {
    return fmt('patternNotInterested');
  }
  return fmt('patternMixed', { status: top.status, pct: top.pct });
}

function renderCalls(c, L){
  const Lb = LABELS[L];
  const s = c.callStats;
  document.getElementById('calls-metric-strip').innerHTML =
    orderSummaryCard('phone-call', Lb.totalAttemptsLabel, s.totalAttempts, CHART_COLORS.neutral) +
    orderSummaryCard('signal', Lb.reachRateLabel, s.reachRate + '%', CHART_COLORS.positive) +
    orderSummaryCard('trending-up', Lb.conversionLabel, s.conversionRate + '%', CHART_COLORS.positive) +
    orderSummaryCard('phone-off', Lb.streakLabel, s.unreachableStreak, s.unreachableStreak >= 4 ? CHART_COLORS.negative : CHART_COLORS.neutral);

  // Status breakdown bar chart — full call history (all statuses this
  // customer's calls have ever landed on), independent of the last-5 list.
  const callStatusItems = (c.callStatusBreakdown || []).map(item => ({
    label: item.status, pct: item.pct, detail: `${item.count}${L==='bn'?'টি':''} (${item.pct}%)`,
  }));
  const callStatusChartEl = document.getElementById('calls-status-chart');
  callStatusChartEl.innerHTML = `
    <p class="font-bold text-card-title text-slate-700 mb-3 flex items-center gap-2">📞 ${Lb.callStatusChartTitle}</p>
    ${renderBreakdownBars(callStatusItems, L, CHART_COLORS.neutral, Lb.patternNoData)}`;
  triggerChartGrow(callStatusChartEl);

  document.getElementById('calls-status-summary-line').innerHTML =
    `<i data-lucide="calculator" class="w-3.5 h-3.5 text-gbCall shrink-0 mt-0.5"></i><span><b class="label-micro text-gbCall mr-1">${Lb.computedTag}</b>${computeCallPatternSummary(c.callStatusBreakdown, L)}</span>`;

  // Two independent sections, each capped at 5, so status history and
  // meaningful remarks don't compete for the same 5 slots — a call with
  // no remark still counts toward the status list, and a remark from an
  // older call still makes the remarks list even if it isn't in the
  // latest 5 calls overall.
  const LATEST_LIMIT = 5;

  const meaningfulRemark = call => {
    // A remark of just punctuation/whitespace (e.g. "-", ".") carries no
    // information, so it's treated the same as no remark at all. The
    // backend already nulls out the generic auto-remark text, but this
    // still guards against other placeholder-only values.
    const remark = (call.note || '').trim();
    return /[\p{L}\p{N}]/u.test(remark) ? remark : null;
  };

  const latestStatuses = c.calls.slice(0, LATEST_LIMIT);
  document.getElementById('calls-status-list').innerHTML = latestStatuses.map(call => {
    const dateText = formatCallDate(call.dateRaw, L);
    const agentName = call.agentName || Lb.unknownAgent;
    const newStatusText = translateStatus(call.newStatusRaw, L);
    const sentence = Lb.callSentence
      .replace('{date}', dateText).replace('{agent}', agentName).replace('{status}', newStatusText);
    return `
    <div class="border-l-2 border-gbCall pl-4 py-1 flex gap-2">
      <span class="w-2 h-2 rounded-full mt-1.5 shrink-0 ${CALL_STATUS_DOT[call.status] || 'bg-slate-300'}"></span>
      <p class="text-card-title text-slate-700">${sentence}</p>
    </div>`;
  }).join('') || `<p class="text-body text-slate-500 font-medium">${Lb.patternNoData}</p>`;

  document.getElementById('calls-status-list-note').textContent = c.calls.length > LATEST_LIMIT
    ? Lb.showingLatestStatuses.replace('{n}', LATEST_LIMIT).replace('{total}', c.calls.length)
    : '';

  const remarkCalls = c.calls
    .map(call => ({ call, remark: meaningfulRemark(call) }))
    .filter(x => x.remark !== null);
  const latestRemarks = remarkCalls.slice(0, LATEST_LIMIT);
  document.getElementById('calls-remarks-list').innerHTML = latestRemarks.map(({ call, remark }) => {
    const dateText = formatCallDate(call.dateRaw, L);
    const agentName = call.agentName || Lb.unknownAgent;
    return `
    <p class="text-card-title font-medium text-slate-600 bg-white border border-slate-200 rounded-xl shadow-sm p-4">
      ${Lb.callRemarkLine.replace('{date}', dateText).replace('{remark}', remark).replace('{agent}', agentName)}
    </p>`;
  }).join('');
  document.getElementById('calls-remarks-empty').classList.toggle('hidden', latestRemarks.length > 0);

  document.getElementById('calls-remarks-list-note').textContent = remarkCalls.length > LATEST_LIMIT
    ? Lb.showingLatestRemarks.replace('{n}', LATEST_LIMIT).replace('{total}', remarkCalls.length)
    : '';

  document.getElementById('calls-summary-line').innerHTML =
    `<i data-lucide="sparkles" class="w-3.5 h-3.5 text-gbCall shrink-0 mt-0.5"></i><span><b class="label-micro text-gbCall mr-1">${Lb.aiCachedTag}</b>${c.callPatternSummary[L]}</span>`;
}

/* ============ Delivery (addresses, metric strip, summary) ============ */
/* ---- Delivery: courier bar chart + per-order timeline stepper ---- */
function renderCourierBarChart(couriers, L){
  if (!couriers || !couriers.length) {
    return `<p class="text-body font-medium text-slate-400">${LABELS[L].patternNoData}</p>`;
  }
  const sorted = couriers.slice().sort((a, b) => b.total - a.total);
  const rows = sorted.map(d => {
    const rate = Math.round(d.successRate);
    const color = rate >= 70 ? CHART_COLORS.positive : rate >= 40 ? CHART_COLORS.warning : CHART_COLORS.negative;
    return `
    <div class="mb-2.5 group relative">
      <div class="flex justify-between text-body font-medium text-slate-600 mb-1">
        <span>${d.courier[L]}</span>
        <span class="font-bold" style="color:${color}">${rate}%</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
        <div class="chart-bar-fill h-full rounded-full" style="width:0%;background:${color}" data-grow-width="${rate}%"></div>
      </div>
      <div class="hidden group-hover:block absolute -top-1 left-1/2 -translate-x-1/2 -translate-y-full bg-slate-800 text-white text-micro font-semibold rounded-lg px-2.5 py-1 whitespace-nowrap z-10 shadow-lg pointer-events-none">${d.total} ${L==='bn'?'অর্ডার':'orders'} · ${rate}% ${L==='bn'?'সফল':'success'}</div>
    </div>`;
  }).join('');
  return `
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
    <p class="font-bold text-card-title text-slate-700 mb-3">🚚 ${L==='bn'?'কুরিয়ার পারফরম্যান্স':'Courier Performance'}</p>
    <div class="space-y-2.5">${rows}</div>
  </div>`;
}

// Order → Shipped → In-Transit → Delivered, matching TestMaster's own
// CreationDate → ShippingDate → ShippedAt → DeliveredAt columns 1:1. A
// step lights up once its date is populated; the last populated step is
// "current". Any step still null just reads as not-reached-yet, not an error.
function renderDeliveryTimeline(order, L){
  const t = order.timeline || {};
  const steps = [
    { key: 'orderDate', label: L==='bn'?'অর্ডার':'Order', icon: 'shopping-cart' },
    { key: 'shippingDate', label: L==='bn'?'শিপড':'Shipped', icon: 'package' },
    { key: 'shippedAt', label: L==='bn'?'ট্রানজিটে':'In-Transit', icon: 'truck' },
    { key: 'deliveredAt', label: L==='bn'?'ডেলিভার্ড':'Delivered', icon: 'check-circle-2' },
  ];
  let lastDone = -1;
  steps.forEach((s, i) => { if (t[s.key]) lastDone = i; });

  return `
  <div class="flex items-start">
    ${steps.map((s, i) => {
      const done = i <= lastDone;
      return `
      <div class="flex items-center ${i < steps.length - 1 ? 'flex-1' : ''}">
        <div class="flex flex-col items-center gap-1 shrink-0 w-16">
          <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:${done ? CHART_COLORS.positive : '#f1f5f9'}">
            <i data-lucide="${done ? 'check' : s.icon}" class="w-4 h-4" style="color:${done ? '#fff' : '#94a3b8'}"></i>
          </div>
          <span class="text-micro font-semibold text-center" style="color:${done ? '#334155' : '#94a3b8'}">${s.label}</span>
          <span class="text-micro text-slate-400 text-center">${t[s.key] || '—'}</span>
        </div>
        ${i < steps.length - 1 ? `<div class="h-0.5 flex-1 mx-1 mt-4" style="background:${i < lastDone ? CHART_COLORS.positive : '#e2e8f0'}"></div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// Courier-confirmed "delivered" while the business status still shows
// something else is exactly the discrepancy an agent needs to see —
// confirmed live on a real order (status='intransit',
// deliveryPartnerStatus='delivered').
function deliveryStatusMismatch(order){
  const dps = (order.deliveryPartnerStatus || '').toLowerCase();
  return dps === 'delivered' && order.status !== 'delivered';
}

    <div class="rounded-xl overflow-hidden bg-white shadow-sm hover:shadow-md transition-shadow border border-slate-200 border-l-4 ${st.border} ${isOpen ? 'md:col-span-2' : ''}">

    : '';
  const summary = (L==='bn'
    ? `${c.delivery.courier.bn} দিয়ে ${c.delivery.successRate}% ডেলিভারি সফল হয়েছে, গড় সময় ${c.avgDeliveryDays} দিন। ${c.addresses.length > 1 ? c.addresses.length + 'টি ভিন্ন ঠিকানা ব্যবহার করেছেন।' : 'সবসময় একই ঠিকানায় ডেলিভারি নিয়েছেন।'}`
    : `${c.delivery.successRate}% deliveries succeeded via ${c.delivery.courier.en}, averaging ${c.avgDeliveryDays} days. ${c.addresses.length > 1 ? 'Has used ' + c.addresses.length + ' different addresses.' : 'Always delivers to the same address.'}`) + damageNote;
  document.getElementById('delivery-summary-line').innerHTML = `<i data-lucide="calculator" class="w-3.5 h-3.5 shrink-0 mt-0.5" style="color:#1D9E75"></i><span><b class="label-micro mr-1" style="color:#1D9E75">${Lb.computedTag}</b>${summary}</span>`;
}

function toggleDeliveryOrder(invoice){
  expandedDeliveryInvoice = (expandedDeliveryInvoice === invoice) ? null : invoice;
  renderDelivery(CUSTOMERS[currentCustomerKey], currentLang);

/* ============ Heatmap with real dates + click ============ */
/* ---- Real per-day aggregation for the heatmaps (replaces the old
   Math.random() simulation). Order dates come from the backend as a plain
   SQL `date` (YYYY-MM-DD, no time); call dates come from a datetime2
   (YYYY-MM-DDTHH:mm:ss). Reading the first 10 chars avoids any Date-object
   timezone round-trip nudging a record into the wrong calendar day. ---- */
function rawDateKey(raw){
  if (!raw || typeof raw !== 'string') return null;
  const m = raw.match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : null;
}
function gridDateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const BN_WEEKDAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const EN_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function weekdayName(d, L){ return L==='bn' ? BN_WEEKDAYS[d.getDay()] : EN_WEEKDAYS[d.getDay()]; }

function groupOrdersByDay(orders){
  const map = {};
  (orders || []).forEach(o => {
    const key = rawDateKey(o.date && (o.date.bn || o.date.en));
    if (!key) return;
    if (!map[key]) map[key] = { invoiceCount: 0, totalSales: 0, totalQty: 0 };
    map[key].invoiceCount += 1;
    map[key].totalSales += orderTotal(o);
    map[key].totalQty += (o.items || []).reduce((s, it) => s + (it.qty || 0), 0);
  });
  return map;
}
function groupCallsByDay(calls){
  const map = {};
  (calls || []).forEach(call => {
    const key = rawDateKey(call.dateRaw);
    if (!key) return;
    if (!map[key]) map[key] = { callCount: 0, positive: 0, negative: 0, follow: 0 };
    map[key].callCount += 1;
    map[key][call.status === 'positive' ? 'positive' : call.status === 'negative' ? 'negative' : 'follow'] += 1;
  });
  return map;
}

function buildHeatmap(elementId, type, c){
  const container = document.getElementById(elementId);
  container.innerHTML = '';
  const meta = [];
  const today = new Date();
  const days = 84;
  const L = currentLang;
  // Saturated fills need a light date-number for contrast; pale fills need a dark one.
  const DARK_BG = ['bg-lime-600', 'bg-purple-500'];
  const orderMap = type === 'order' ? groupOrdersByDay(c.orders) : null;
  const callMap = type === 'call' ? groupCallsByDay(c.calls) : null;

  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const day = type === 'order' ? orderMap[gridDateKey(d)] : callMap[gridDateKey(d)];
    const cell = document.createElement('div');
    cell.className = 'heatmap-cell';
    let count = 0, negative = false, bgClass = 'bg-slate-100', stats = null;

    if (type === 'order' && day) {
      stats = day;
      count = day.invoiceCount;
      bgClass = day.invoiceCount >= 3 ? 'bg-lime-600' : day.invoiceCount === 2 ? 'bg-lime-400' : 'bg-lime-200';
    } else if (type === 'call' && day) {
      stats = day;
      count = day.callCount;
      negative = day.negative > 0;
      bgClass = negative ? 'bg-red-300' : (day.callCount >= 2 ? 'bg-purple-500' : 'bg-purple-200');
    }

    cell.classList.add(bgClass);
    const dateNum = document.createElement('span');
    dateNum.className = 'heatmap-date ' + (DARK_BG.includes(bgClass) ? 'on-dark' : 'on-light');
    dateNum.textContent = d.getDate();
    cell.appendChild(dateNum);

    const dateStr = d.toLocaleDateString(L==='bn' ? 'bn-BD' : 'en-US', {day:'numeric', month:'short', year:'numeric'});
    const dayLabel = weekdayName(d, L);
    cell.setAttribute('aria-label', `${dateStr} (${dayLabel})`);
    cell.onclick = () => openDayDrawer(dateStr, type, count, negative, stats);
    cell.addEventListener('mouseenter', (e) => showHeatmapTooltip(e.currentTarget, type, dateStr, dayLabel, count, negative, stats));
    cell.addEventListener('mouseleave', hideHeatmapTooltip);
    container.appendChild(cell);
    meta.push({date:dateStr, count, negative, stats});
  }
  heatmapMeta[type] = meta;
}

function renderMonthLabels(){
  const today = new Date();
  const months = [];
  for (let i = 2; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    months.push(d.toLocaleDateString(currentLang==='bn' ? 'bn-BD' : 'en-US', {month:'long'}));
  }
  // Only one of these two ever exists in the DOM at a time now — Orders and
  // Calls are separate pages, never both mounted together.
  const orderMonthsEl = document.getElementById('order-heatmap-months');
  const callMonthsEl = document.getElementById('call-heatmap-months');
  if (orderMonthsEl) orderMonthsEl.innerHTML = months.map(m=>`<span>${m}</span>`).join('');
  if (callMonthsEl) callMonthsEl.innerHTML = months.map(m=>`<span>${m}</span>`).join('');
}

/* Shared by the hover tooltip and the click drawer, so real per-day numbers
   only get formatted in one place. */
function formatDayStatsHtml(type, count, negative, stats, L){
  const Lb = LABELS[L];
  if (!count || !stats) return `<p class="text-current opacity-70">${Lb.noDayData}</p>`;
  if (type === 'order') {
    return `
      <div class="flex justify-between gap-4"><span class="opacity-70">${Lb.invoiceLabel}</span><span class="font-semibold">${stats.invoiceCount}</span></div>
      <div class="flex justify-between gap-4"><span class="opacity-70">${Lb.totalAmountLabel}</span><span class="font-semibold">${fmtMoney(stats.totalSales)}</span></div>
      <div class="flex justify-between gap-4"><span class="opacity-70">${Lb.totalQtyLabel}</span><span class="font-semibold">${stats.totalQty}</span></div>`;
  }
  const parts = [];
  if (stats.positive) parts.push(`${stats.positive} ${L==='bn'?'পজিটিভ':'positive'}`);
  if (stats.negative) parts.push(`${stats.negative} ${L==='bn'?'নেগেটিভ':'negative'}`);
  if (stats.follow) parts.push(`${stats.follow} ${L==='bn'?'ফলো-আপ':'follow-up'}`);
  return `
    <div class="flex justify-between gap-4"><span class="opacity-70">${L==='bn'?'মোট কল':'Total calls'}</span><span class="font-semibold">${stats.callCount}</span></div>
    ${parts.length ? `<div class="opacity-90">${parts.join(', ')}</div>` : ''}`;
}

/* ---- Custom hover tooltip (replaces the native title-attribute tooltip,
   which can't show multi-line styled content). Anchored just above the
   hovered cell; pointer-events:none on the tooltip itself so it can never
   swallow the cell's mouseleave. ---- */
function showHeatmapTooltip(cellEl, type, dateStr, dayLabel, count, negative, stats){
  const L = currentLang;
  const tip = document.getElementById('heatmap-tooltip');
  tip.innerHTML = `<p class="font-semibold mb-1">${dateStr} (${dayLabel})</p>
    <div class="space-y-0.5 text-slate-200">${formatDayStatsHtml(type, count, negative, stats, L)}</div>`;
  tip.classList.remove('hidden');
  positionHeatmapTooltip(cellEl, tip);
}
function positionHeatmapTooltip(cellEl, tip){
  const r = cellEl.getBoundingClientRect();
  const tr = tip.getBoundingClientRect();
  const margin = 8;
  let left = r.left + r.width / 2 - tr.width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - margin - tr.width));
  let top = r.top - tr.height - margin;
  if (top < margin) top = r.bottom + margin; // flip below when there's no room above
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideHeatmapTooltip(){
  document.getElementById('heatmap-tooltip').classList.add('hidden');
}

function openDayDrawer(dateStr, type, count, negative, stats){
  const L = currentLang;
  document.getElementById('day-drawer-title').textContent = dateStr;
  const boxBg = type === 'call' && negative ? 'bg-red-50' : 'bg-white';
  const boxBorder = type === 'call' && negative ? 'border-gbRisk/30' : 'border-slate-200';
  const icon = type === 'order' ? 'package' : 'phone-call';
  const iconColor = type === 'order' ? 'text-gbTrust' : 'text-gbCall';
  const title = type === 'order' ? LABELS[L].dayOrdersTitle : LABELS[L].dayCallsTitle;
  const html = `<div class="${boxBg} border ${boxBorder} rounded-xl shadow-sm p-4">
      <p class="font-bold text-card-title text-slate-700 mb-2 flex items-center gap-1"><i data-lucide="${icon}" class="w-4 h-4 ${iconColor}"></i> ${title}</p>
      <div class="text-body font-medium text-slate-600 space-y-1">${formatDayStatsHtml(type, count, negative, stats, L)}</div>
    </div>`;
  document.getElementById('day-drawer-content').innerHTML = html;
  document.getElementById('day-drawer').classList.remove('translate-x-full');
  document.getElementById('drawer-backdrop').classList.remove('hidden');
  lucide.createIcons();
}
function closeDayDrawer(){ document.getElementById('day-drawer').classList.add('translate-x-full'); checkBackdrop(); }
function closeAllDrawers(){
  document.getElementById('day-drawer').classList.add('translate-x-full');
  document.getElementById('action-drawer').classList.add('translate-x-full');
  document.getElementById('drawer-backdrop').classList.add('hidden');

function checkBackdrop(){
  const dayOpen = !document.getElementById('day-drawer').classList.contains('translate-x-full');
  const actionOpen = !document.getElementById('action-drawer').classList.contains('translate-x-full');
  if (!dayOpen && !actionOpen) document.getElementById('drawer-backdrop').classList.add('hidden');
}

// Replaces the old single-scroll-page switchTab(): fully throws away
// whatever page was previously mounted and injects the requested page's
// own skeleton fresh, then runs only that page's render function. `filter`
// is still accepted (e.g. showPage('orders','cancelled')) so every existing
// onclick="switchTab('orders','cancelled')" call site keeps working.
function showPage(pageName, filter){
  currentPage = pageName;
  activeOrderFilter = filter || null;
  ordersShowAll = false;
  productsShowAll = false;

  document.querySelectorAll('.gb-left-item').forEach(el => el.classList.toggle('active', el.dataset.sideTab === pageName));
  document.getElementById('page-container').innerHTML = PAGE_SKELETONS[pageName]();

  if (currentCustomerKey) {
    const c = CUSTOMERS[currentCustomerKey];
    const L = currentLang;
    if (pageName === 'orders') {
      renderOrdersMetrics(c, L);
      buildHeatmap('order-heatmap', 'order', c);
      renderMonthLabels();
      renderOrders(c, L);
    } else if (pageName === 'products') {
      renderProducts(c, L);
    } else if (pageName === 'calls') {
      buildHeatmap('call-heatmap', 'call', c);
      renderMonthLabels();
      renderCalls(c, L);
    } else if (pageName === 'ai') {
      renderIdentityCard(c, L);
    } else if (pageName === 'delivery') {
      renderDelivery(c, L);
    } else if (pageName === 'channel') {
      renderChannel(c, L);
    }
  }

  lucide.createIcons();
}

// Kept as the public name every existing onclick="switchTab(...)" call site
// already uses (badges, metric tiles, filter chips, etc.) — a thin alias
// over the new page-swapping implementation above.
function switchTab(tabName, filter){ showPage(tabName, filter); }

const API_BASE = 'http://127.0.0.1:8000/api';

// No login UI exists yet — auth.py expects "Authorization: Bearer <token>"
// matching a real dcm.users.current_session_token value. Paste one here
// for testing (see the backend's curl/Postman testing notes for how to
// set one via SQL). Left blank, requests will get 401 from the backend.
const AUTH_TOKEN = 'ec87fb0d-fbb7-45f9-9d8b-b04f3ce03d44';

function authHeaders(){
  return AUTH_TOKEN ? { 'Authorization': `Bearer ${AUTH_TOKEN}` } : {};
}
